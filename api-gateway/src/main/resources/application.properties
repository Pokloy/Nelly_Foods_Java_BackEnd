spring.cloud.gateway.server.webflux.routes[3].uri=lb://reviews-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/reviews-service/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[3].filters[1]=AuthenticationFilter

# Order Service
spring.cloud.gateway.server.webflux.routes[4].id=order-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/order-service/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[4].filters[1]=AuthenticationFilter

# Shipping Service
