spring.application.name=api-gateway
server.port=8080

# 1. Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# 2. FIXED: The "Secret Handshake" 
# Use the explicit 'name' and 'args' format to avoid the "null value" binding error
spring.cloud.gateway.server.webflux.default-filters[0].name=AddRequestHeader
spring.cloud.gateway.server.webflux.default-filters[0].args.name=X-Gateway-Secret
spring.cloud.gateway.server.webflux.default-filters[0].args.value=AlierInternalOnly123

# 3. ROUTES
# User Service
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/user-service/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

# Recruitment Service
spring.cloud.gateway.server.webflux.routes[1].id=recruitment-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://recruitment-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/recruitment-service/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[1].filters[1]=AuthenticationFilter

# Product Service
spring.cloud.gateway.server.webflux.routes[2].id=product-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/product-service/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[2].filters[1]=AuthenticationFilter

# Reviews Service
