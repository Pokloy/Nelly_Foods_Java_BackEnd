spring.application.name=shipping-service
server.port=8086

spring.profiles.active=local
# spring.profiles.active=docker

# database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db
spring.datasource.username=postgres
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database=POSTGRESQL
spring.datasource.sql-script-encoding=UTF-8
spring.datasource.platform=postgres

# Log Level
logging.level.com.example=debug

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.security.enabled=false   

# ------------------------------------
# Spring Boot Actuator Configuration
# ------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.info.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoints.web.base-path=/actuator


# Optional - Customize server port or path
management.server.port=8086
# management.endpoints.web.base-path=/manage

# Optional - Add application info
info.app.name=order-service 
info.app.description=Handles all user processing and management
info.app.version=1.0.0